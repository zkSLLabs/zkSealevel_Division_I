name: CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # Provide valid base58 program id and chain id for scripts/conformance.js and tests
      PROGRAM_ID_VALIDATOR_LOCK: 4DDKoz69pr37yBMW9LVeuM7P2GHS9BQ9ctLHydbWeYxQ
      CHAIN_ID: "1"
      AGGREGATOR_KEYPAIR_PATH: ./keys/aggregator.json
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zksl
        ports:
          - 5432:5432
        # Proper healthcheck prevents the previous 'invalid reference format' issues from custom docker commands
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install root deps
        run: npm ci --no-audit --no-fund

      - name: Install package deps
        run: |
          npm --prefix orchestrator ci --no-audit --no-fund
          npm --prefix indexer ci --no-audit --no-fund
          npm --prefix cli ci --no-audit --no-fund

      - name: Lint
        run: |
          npm --prefix orchestrator run lint
          npm --prefix indexer run lint
          npm --prefix cli run lint || true

      - name: Build services
        run: npm run build:services

      - name: Run tests
        run: npm run test:all

      - name: Conformance (Node vs Rust)
        run: npm run conformance

name: zksl-ci

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root deps
        run: |
          npm ci || true
      - name: Install orchestrator and indexer deps
        run: |
          npm --prefix orchestrator ci
          npm --prefix indexer ci
      - name: Lint TypeScript
        run: |
          npm --prefix orchestrator run lint || true
          npm --prefix indexer run lint || true
      - name: Build services
        run: npm run build:services
      - name: Run orchestrator tests
        run: npm run test:orchestrator
      - name: Run KATs
        run: npm run test:kats

  indexer-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zksl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zksl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          npm --prefix indexer ci
      - name: Apply migrations
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          bash scripts/db_migrate.sh
      - name: Build indexer
        run: npm --prefix indexer run build
      - name: Run indexer unit tests
        run: npm --prefix indexer run test

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test (workspace crates)
        run: |
          cargo test --workspace --all-features --no-run
          cargo test --workspace --all-features

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install root deps (blake3)
        run: |
          npm install --no-audit --no-fund
      - name: Generate aggregator key
        run: node scripts/gen_aggregator_key.js keys/aggregator.json
      - name: Run conformance (Node vs Rust proof_hash)
        env:
          PROGRAM_ID_VALIDATOR_LOCK: Val1dAt0rLock1111111111111111111111111111111
          CHAIN_ID: 1
        run: node scripts/conformance.js

