[package]
name = "validator_lock"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }
blake3 = "1.5"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"


[features]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
skip-anchor-program = []
clippy-skip = []


