name: Build SBF Programs

on:
  workflow_dispatch:
  push:
    paths:
      - "programs/**"
      - "Anchor.toml"
      - ".github/workflows/build-sbf.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOLANA_VERSION: v1.18.26
      ANCHOR_CLI_VERSION: 0.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI (with retry + fallback)
        run: |
          set -euxo pipefail
          # Try official installer (release.solana.com) with retries
          INSTALL_URL="https://release.solana.com/${SOLANA_VERSION}/install"
          for attempt in 1 2 3; do
            if curl -fsSL "$INSTALL_URL" | sh -s -; then
              break
            fi
            echo "Solana installer attempt $attempt failed; retrying..."
            sleep 2
          done

          if [ -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
            export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          else
            echo "Falling back to GitHub release tarball for Solana CLI..."
            TARBALL_URL="https://github.com/solana-labs/solana/releases/download/${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
            curl -fsSL "$TARBALL_URL" -o /tmp/solana.tar.bz2
            mkdir -p "$HOME/.local/share/solana/install"
            tar -xjf /tmp/solana.tar.bz2 -C "$HOME/.local/share/solana/install"
            echo "$HOME/.local/share/solana/install/solana-release/bin" >> $GITHUB_PATH
            export PATH="$HOME/.local/share/solana/install/solana-release/bin:$PATH"
          fi

          hash -r || true
          which solana || true
          solana --version

      - name: Install Anchor CLI
        run: |
          cargo install anchor-cli --version ${ANCHOR_CLI_VERSION}
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          anchor --version

      - name: Anchor build
        run: |
          anchor build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbf-artifacts
          path: |
            target/deploy/*.so
            target/deploy/*.json
          if-no-files-found: error


