version: "3.9"
services:
  solana:
    image: solanalabs/solana:v1.18.15
    command: solana-test-validator -r --ledger /ledger --wal-recovery-mode skip_any_corrupted_record
    ports:
      - "8899:8899"
      - "8900:8900"
    volumes:
      - ../ledger:/ledger
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -s http://localhost:8899 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zksl
    ports:
      - "5432:5432"
    volumes:
      - ../pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  orchestrator:
    build:
      context: ../orchestrator
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - RPC_URL=http://solana:8899
      - WS_URL=ws://solana:8900
      - PROGRAM_ID_VALIDATOR_LOCK=${PROGRAM_ID_VALIDATOR_LOCK}
      - CHAIN_ID=${CHAIN_ID}
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/zksl
    ports:
      - "8080:8080"
    depends_on:
      - solana
      - postgres
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -sf http://localhost:8080/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  prover:
    build:
      context: ../prover
      dockerfile: Dockerfile
    environment:
      - RPC_URL=http://solana:8899
      - ARTIFACT_DIR=/artifacts
    volumes:
      - ../data/artifacts:/artifacts
    depends_on:
      - solana

  indexer:
    build:
      context: ../indexer
    environment:
      - RPC_URL=http://solana:8899
      - WS_URL=ws://solana:8900
      - PROGRAM_ID_VALIDATOR_LOCK=${PROGRAM_ID_VALIDATOR_LOCK}
      - CHAIN_ID=${CHAIN_ID}
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/zksl
    depends_on:
      - solana
      - postgres

networks:
  default:
    driver: bridge

